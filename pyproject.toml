[project]
name = "concert-tracker"
version = "0.1.0"
description = "Tracks upcoming concerts in Mexico City from Songkick."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    "apscheduler>=3.10",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
